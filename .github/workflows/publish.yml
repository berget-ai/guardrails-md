name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. "none" publishes the current package.json version.
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC trusted publishing (npmjs.com → @bergetai → Trusted Publisher:
      # berget-ai/opencode-systemone-gate / publish.yml). No NPM_TOKEN
      # needed — the classic token route expired (misleading 404/401 on
      # publish).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The plugin ships as raw TypeScript (opencode transpiles it on load);
      # a parse check is the whole "build".
      - name: Parse check
        run: npx --yes esbuild index.ts --outfile=/dev/null

      - name: Bump version
        if: ${{ inputs.bump != 'none' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} -m "release: %s"
          git push --follow-tags

      - name: Publish to NPM (OIDC trusted publishing)
        run: |
          npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
          npm publish
