name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. "none" publishes the current package.json version. Bump via a normal PR when releasing.
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing (npmjs.com → @bergetai → Trusted Publisher:
      # berget-ai/guardrails-md / publish.yml). No NPM_TOKEN
      # needed — the classic token route expired (misleading 404/401 on
      # publish).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # The package ships raw .ts via a files whitelist; forgetting a module
      # there publishes a plugin that fails to load for every user. Pack,
      # extract, and bundle from INSIDE the tarball — this enforces
      # "the published package is self-contained" structurally, for every
      # current and future runtime module, with no list to maintain.
      - name: Tarball is self-contained
        run: |
          mkdir -p /tmp/pkg && npm pack --pack-destination /tmp/pkg >/dev/null
          tar -xzf /tmp/pkg/*.tgz -C /tmp/pkg
          npx --yes esbuild --bundle /tmp/pkg/package/adapters/opencode.ts /tmp/pkg/package/adapters/pi.ts /tmp/pkg/package/hooks/register.ts \
            --outdir=/tmp/pkg/out --platform=node --format=esm \
            --external:@typesafe-ai/sdk --external:@opencode-ai/plugin --external:@earendil-works/pi-coding-agent "--external:node:*"
          echo "tarball OK: every relative import resolves inside the published package"

      # Version bumps happen via a normal PR (main is protected). This
      # workflow publishes whatever package.json currently says.
      - name: Build cli.js (self-contained bundle for npx)
        run: npx --yes esbuild cli.ts --bundle --platform=node --format=cjs --outfile=cli.js

      - name: Publish to NPM (OIDC trusted publishing)
        run: |
          npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
          npm publish
