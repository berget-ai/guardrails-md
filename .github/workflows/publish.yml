name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. "none" publishes the current package.json version. Bump via a normal PR when releasing.
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing (npmjs.com → @bergetai → Trusted Publisher:
      # berget-ai/guardrails-md / publish.yml). No NPM_TOKEN
      # needed — the classic token route expired (misleading 404/401 on
      # publish).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The plugin ships as raw TypeScript (opencode transpiles it on load);
      # a parse check is the whole "build". --bundle forces esbuild to
      # RESOLVE relative imports — a plain parse accepts index.ts even when
      # ./internals.js is missing from the package, which is exactly the
      # breakage the files-whitelist below must never ship.
      - name: Parse + import-resolution check
        run: npx --yes esbuild --bundle index.ts --outfile=/dev/null --external:@typesafe-ai/sdk --external:@opencode-ai/plugin "--external:node:*"

      # The package ships raw .ts via a files whitelist; forgetting a module
      # there publishes a plugin that fails to load for every user. Assert
      # the tarball actually contains every runtime module index.ts imports.
      - name: Tarball contains all runtime modules
        run: |
          PACKED=$(npm pack --dry-run --json)
          for f in index.ts internals.ts; do
            echo "$PACKED" | grep -q "\"$f\"" || { echo "::error ::$f missing from npm tarball (check package.json files)"; exit 1; }
          done
          echo "tarball OK: index.ts + internals.ts present"

      # Version bumps happen via a normal PR (main is protected). This
      # workflow publishes whatever package.json currently says.
      - name: Publish to NPM (OIDC trusted publishing)
        run: |
          npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
          npm publish
